<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外食紀錄</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>外食紀錄</h1>
      <form id="food_form">
        <label for="date">日付</label>
        <input type="date" id="date" required />

        <label for="shop">店名</label>

        <input type="text" id="shop" placeholder="ex：○○食堂" required />

        <div class="shop-buttons">
          <button type="button" class="shop-btn" data-shop="つきじ">
            つきじ
          </button>
          <button type="button" class="shop-btn" data-shop="billy">
            billy
          </button>

          <button type="button" class="shop-btn" data-shop="丸亀製麺">
            丸亀製麺
          </button>
        </div>

        <label for="price">金額</label>
        <input type="number" id="price" placeholder="ex：1200" required />

        <label for="meal">種類</label>
        <select id="meal" required>
          <option value="">選択してください</option>
          <option value="ランチ">ランチ</option>
          <option value="ディナー">ディナー</option>
        </select>
        <button type="submit" class="submit-btn">記録を追加 / 編集</button>
      </form>

      <div id="record_list"></div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
