<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外食紀錄</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>外食紀錄</h1>
      <form id="food_form">
        <!-- 日付 -->
        <div class="form-row">
          <label for="date">日付</label>
          <input type="date" id="date" required />
        </div>

        <!-- 店名 -->
        <div class="form-row">
          <label for="shop">店名</label>
          <input type="text" id="shop" placeholder="ex：○○食堂" required />
          <div class="shop-buttons">
            <button type="button" class="shop-btn" data-shop="つきじ">
              つきじ
            </button>
            <button type="button" class="shop-btn" data-shop="billy">
              billy
            </button>
            <button type="button" class="shop-btn" data-shop="丸亀製麺">
              丸亀製麺
            </button>
          </div>
        </div>

        <!-- 金額 -->
        <div class="form-row">
          <label for="price">金額</label>
          <input type="number" id="price" placeholder="ex：1200" required />
        </div>

        <!-- 種類 -->
        <div class="form-row">
          <label for="meal">種類</label>
          <div class="meal-buttons">
            <button type="button" class="meal-btn" data-meal="ランチ">
              ランチ
            </button>

            <button type="button" class="meal-btn" data-meal="ディナー">
              ディナー
            </button>
            <input type="hidden" id="meal" required />
          </div>

          <!-- <select id="meal" required>
            <option value="">選択してください</option>
            <option value="ランチ">ランチ</option>
            <option value="ディナー">ディナー</option>
          </select> -->
        </div>

        <!-- button -->
        <button type="submit" class="submit-btn">記録を追加 / 編集</button>
      </form>

      <div id="record_list"></div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
