<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外食紀錄</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>外食紀錄</h1>
      <form id="food_form">
        <label for="date">日期</label>
        <input type="date" id="date" required />

        <label for="shop">店名</label>
        <input type="text" id="shop" placeholder="例如：○○食堂" required />

        <label for="price">金額</label>
        <input type="number" id="price" placeholder="例如：1200" required />

        <label for="meal">類型</label>
        <select id="meal" required>
          <option value="">請選擇</option>
          <option value="午餐">午餐</option>
          <option value="晚餐">晚餐</option>
        </select>
        <button type="submit">新增 / 修改紀錄</button>
      </form>

      <div id="record_list"></div>
    </div>
  </body>
  <script src="./script.js"></script>
</html>
